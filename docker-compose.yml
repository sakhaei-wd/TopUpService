services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: topup-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  topup-service:
    build:
      context: .
      dockerfile: src/TopUpService.API/Dockerfile

    container_name: topup-service

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TopUpDb: "Data Source=/data/topup.db"
      RabbitMq__Host: rabbitmq

    volumes:
      - topup-data:/data

    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  topup-data: